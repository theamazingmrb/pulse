<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="needle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="50.1%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Compass face ring: 4 arcs with gaps at the cardinal points -->
  <g fill="none" stroke="#ffffff" stroke-width="26" opacity="0.95">
    <path d="M313.5 98.1 A168 168 0 0 1 413.9 198.5"/>
    <path d="M413.9 313.5 A168 168 0 0 1 313.5 413.9"/>
    <path d="M198.5 413.9 A168 168 0 0 1 98.1 313.5"/>
    <path d="M98.1 198.5 A168 168 0 0 1 198.5 98.1"/>
  </g>

  <!-- Cardinal tick marks (N/E/S/W) sitting in the ring gaps -->
  <g fill="#ffffff" opacity="0.95">
    <rect x="238" y="62" width="36" height="52" rx="18"/>
    <rect x="394" y="238" width="52" height="36" rx="18"/>
    <rect x="238" y="398" width="36" height="52" rx="18"/>
    <rect x="66" y="238" width="52" height="36" rx="18"/>
  </g>

  <!-- Compass needle: north (amber) / south (white) -->
  <path d="M256 150 L292 256 L256 362 L220 256 Z" fill="url(#needle)"/>

  <!-- Center pivot -->
  <circle cx="256" cy="256" r="30" fill="#6366f1"/>
  <circle cx="256" cy="256" r="30" fill="none" stroke="#ffffff" stroke-width="10"/>
</svg>
